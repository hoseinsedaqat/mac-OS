@if (system.state() === 'splash' || system.state() === 'booting') {
  <!-- Splash and boot are driven by ONE persistent BootComponent instance:
       it owns its own internal timers and must never be destroyed/recreated
       mid-sequence (that would reset it and freeze the boot screen forever). -->
  <mw-boot />
} @else {
  @switch (system.state()) {
    @case ('locked') {
      <mw-lock-screen />
    }
    @case ('login') {
      <mw-login />
    }
    @case ('desktop') {
      <mw-desktop />
    }
    @case ('sleeping') {
      <mw-desktop />
      <div
        class="mw-sleep-overlay"
        role="button"
        tabindex="0"
        aria-label="Click or press any key to continue"
        (click)="wake()"
        (keydown.enter)="wake()"
        (keydown.space)="wake()"
      ></div>
    }
    @case ('restarting') {
      <mw-restart-screen />
    }
    @case ('off') {
      <mw-power-off-screen />
    }
  }
}

<mw-context-menu />
<mw-confirm-dialog />
