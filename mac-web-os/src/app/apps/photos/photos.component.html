<div class="mw-photos">
  <aside class="mw-photos__sidebar">
    <h4>Albums</h4>
    @for (album of albums; track album) {
      <button type="button" class="mw-photos__album" [class.active]="activeAlbum() === album" (click)="selectAlbum(album)">
        {{ album }}
      </button>
    }
  </aside>

  <section class="mw-photos__main">
    <div class="mw-photos__toolbar">
      <mw-icon name="search" [size]="13" />
      <input type="text" placeholder="جست‌وجوی تصاویر" [(ngModel)]="query" />
    </div>

    <div class="mw-photos__grid mw-scroll">
      @for (item of items(); track item.id; let i = $index) {
        <button type="button" class="mw-photos__cell" (click)="openViewer(i)">
          @if (!hasFailed(item.id)) {
            <img [src]="item.file" [alt]="item.title" loading="lazy" (error)="markFailed(item.id)" />
          } @else {
            <div class="mw-photos__placeholder">
              <mw-icon name="photos" [size]="26" />
            </div>
          }
          <span class="mw-photos__title">{{ item.title }}</span>
          <button type="button" class="mw-photos__remove" aria-label="حذف از مجموعه" (click)="remove(item.id, $event)">
            <mw-icon name="close" [size]="11" />
          </button>
        </button>
      } @empty {
        <p class="mw-photos__empty">تصویری یافت نشد.</p>
      }
    </div>
  </section>

  @if (activeItem; as item) {
    <div class="mw-photos__viewer" (click)="closeViewer()">
      <button type="button" class="mw-photos__nav mw-photos__nav--prev" (click)="prev(); $event.stopPropagation()" aria-label="قبلی">
        <mw-icon name="chevronLeft" [size]="22" />
      </button>
      <img [src]="item.file" [alt]="item.title" (click)="$event.stopPropagation()" />
      <button type="button" class="mw-photos__nav mw-photos__nav--next" (click)="next(); $event.stopPropagation()" aria-label="بعدی">
        <mw-icon name="chevronRight" [size]="22" />
      </button>
      <button type="button" class="mw-photos__close" aria-label="بستن" (click)="closeViewer()">
        <mw-icon name="close" [size]="16" />
      </button>
      <span class="mw-photos__viewer-title">{{ item.title }}</span>
    </div>
  }
</div>
