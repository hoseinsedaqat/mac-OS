<div class="mw-mail">
  <aside class="mw-mail__sidebar">
    <button type="button" class="mw-mail__compose" (click)="startCompose()">
      <mw-icon name="plus" [size]="13" />
      Compose
    </button>
    <button type="button" class="mw-mail__folder" [class.active]="folder() === 'inbox' && !query()" (click)="selectFolder('inbox')">
      <mw-icon name="mail" [size]="14" />
      <span>Inbox</span>
      @if (unreadInbox() > 0) {
        <span class="mw-mail__badge">{{ unreadInbox() }}</span>
      }
    </button>
    <button type="button" class="mw-mail__folder" [class.active]="folder() === 'sent' && !query()" (click)="selectFolder('sent')">
      <mw-icon name="send" [size]="14" />
      <span>Sent</span>
    </button>
    <button type="button" class="mw-mail__folder" [class.active]="folder() === 'drafts' && !query()" (click)="selectFolder('drafts')">
      <mw-icon name="file-text" [size]="14" />
      <span>Drafts</span>
    </button>
    <p class="mw-mail__demo-note">Demo mode — no real emails are sent</p>
  </aside>

  <section class="mw-mail__list-pane">
    <div class="mw-mail__search">
      <mw-icon name="search" [size]="13" />
      <input type="text" placeholder="Search Mail" [(ngModel)]="query" />
    </div>
    <div class="mw-mail__list mw-scroll">
      @for (message of list(); track message.id) {
        <button
          type="button"
          class="mw-mail__item"
          [class.active]="selectedId() === message.id"
          [class.unread]="!message.read"
          (click)="openMessage(message)"
        >
          <div class="mw-mail__item-head">
            <strong>{{ message.from }}</strong>
            <span>{{ relative(message.date) }}</span>
          </div>
          <p class="mw-mail__subject">{{ message.subject }}</p>
          <p class="mw-mail__preview">{{ message.body.slice(0, 60) }}</p>
        </button>
      } @empty {
        <p class="mw-mail__empty">No messages found</p>
      }
    </div>
  </section>

  <section class="mw-mail__reading">
    @if (composing()) {
      <div class="mw-mail__compose-form">
        <input type="text" placeholder="To" [(ngModel)]="composeTo" />
        <input type="text" placeholder="Subject" [(ngModel)]="composeSubject" />
        <textarea class="mw-scroll" placeholder="Email body…" [(ngModel)]="composeBody"></textarea>
        <div class="mw-mail__compose-actions">
          <button type="button" class="mw-btn" (click)="saveDraft()">Save Draft</button>
          <button type="button" class="mw-btn mw-btn-accent" (click)="send()">Send (simulated)</button>
        </div>
      </div>
    } @else if (selected(); as message) {
      <header class="mw-mail__reading-head">
        <h2>{{ message.subject }}</h2>
        <button type="button" aria-label="Delete" (click)="deleteMessage(message)"><mw-icon name="trash2" [size]="16" /></button>
      </header>
      <p class="mw-mail__meta">From: {{ message.from }} — To: {{ message.to }}</p>
      <div class="mw-mail__body mw-scroll">{{ message.body }}</div>
    } @else {
      <div class="mw-mail__placeholder">
        <mw-icon name="mail" [size]="36" />
        <p>No message selected</p>
      </div>
    }
  </section>
</div>
