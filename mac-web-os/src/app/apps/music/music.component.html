<div class="mw-music">
  <div class="mw-music__demo-badge">حالت نمایشی (Demo) — بدون پخش صدای واقعی</div>

  <div class="mw-music__now-playing">
    <div class="mw-music__art">
      <mw-icon name="music" [size]="40" />
    </div>
    <h2>{{ currentTrack().title }}</h2>
    <p>{{ currentTrack().artist }}</p>

    <div class="mw-music__progress">
      <span>{{ formatTime(elapsed()) }}</span>
      <input type="range" min="0" max="100" [value]="progressPercent()" (input)="seek($event)" aria-label="پیشرفت آهنگ" />
      <span>{{ formatTime(currentTrack().duration) }}</span>
    </div>

    <div class="mw-music__controls">
      <button type="button" aria-label="قبلی" (click)="prev()"><mw-icon name="prev" [size]="18" /></button>
      <button type="button" class="mw-music__play" [attr.aria-label]="isPlaying() ? 'توقف' : 'پخش'" (click)="togglePlay()">
        <mw-icon [name]="isPlaying() ? 'pause' : 'play'" [size]="20" />
      </button>
      <button type="button" aria-label="بعدی" (click)="next()"><mw-icon name="next" [size]="18" /></button>
    </div>

    <div class="mw-music__volume">
      <mw-icon [name]="settings.settings().volume === 0 ? 'volume-mute' : 'volume'" [size]="14" />
      <input type="range" min="0" max="100" [value]="settings.settings().volume" (input)="setVolume($event)" aria-label="صدا" />
    </div>
  </div>

  <div class="mw-music__list mw-scroll">
    @for (track of tracks; track track.id; let i = $index) {
      <button type="button" class="mw-music__track" [class.active]="currentIndex() === i" (click)="selectTrack(i)">
        <mw-icon name="music" [size]="15" />
        <div class="mw-music__track-info">
          <strong>{{ track.title }}</strong>
          <span>{{ track.artist }}</span>
        </div>
        <span class="mw-music__duration">{{ formatTime(track.duration) }}</span>
      </button>
    }
  </div>
</div>
