<div class="mw-boot" (click)="skipSplash()" (keydown.enter)="skipSplash()" (keydown.space)="skipSplash()" tabindex="0">
  @if (state() === 'splash') {
    <div class="mw-boot__logo-wrap">
      <div class="mw-boot__logo">
        <img src="icons/logo.png" alt="" width="84" height="84" />
      </div>
      <h1 class="mw-boot__title">MacWeb OS</h1>
      <div class="mw-boot__bar">
        <div class="mw-boot__bar-fill" [style.width.%]="splashProgress()"></div>
      </div>
      @if (canSkip()) {
        <p class="mw-boot__hint">{{ i18n.t('shell.boot.skipHint') }}</p>
      }
    </div>
  } @else {
    <div class="mw-boot__logo-wrap">
      <div class="mw-boot__logo mw-boot__logo--small">
        <img src="icons/logo.png" alt="" width="56" height="56" />
      </div>
      <div class="mw-boot__bar">
        <div class="mw-boot__bar-fill" [style.width.%]="bootProgress()"></div>
      </div>
      <p class="mw-boot__step">{{ stepLabel() }}</p>
    </div>
  }
</div>
