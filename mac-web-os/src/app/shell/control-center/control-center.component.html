@if (isOpen()) {
  <div class="mw-cc__scrim" (click)="close()"></div>
  <div class="mw-cc" role="dialog" [attr.aria-label]="i18n.t('shell.controlCenter.title')">
    <div class="mw-cc__grid">
      <button type="button" class="mw-cc__toggle" [class.active]="settings.settings().wifiEnabled" (click)="toggleWifi()">
        <mw-icon name="wifi" [size]="18" />
        <span>Wi-Fi</span>
      </button>
      <button type="button" class="mw-cc__toggle" [class.active]="settings.settings().focusMode" (click)="toggleFocus()">
        <mw-icon name="moon" [size]="18" />
        <span>{{ i18n.t('shell.controlCenter.focus') }}</span>
      </button>
      <button
        type="button"
        class="mw-cc__toggle"
        [class.active]="settings.theme() === 'dark'"
        (click)="toggleTheme()"
      >
        <mw-icon [name]="settings.theme() === 'dark' ? 'moon' : 'sun'" [size]="18" />
        <span>{{ i18n.t('shell.controlCenter.appearance') }}</span>
      </button>
      <button
        type="button"
        class="mw-cc__toggle"
        [class.active]="settings.settings().dockAutoHide"
        (click)="toggleDockAutoHide()"
      >
        <mw-icon name="grid" [size]="18" />
        <span>{{ i18n.t('shell.controlCenter.autoHideDock') }}</span>
      </button>
    </div>

    <div class="mw-cc__slider-card">
      <div class="mw-cc__slider-head">
        <mw-icon name="globe" [size]="16" />
        <span>{{ i18n.t('shell.controlCenter.language') }}</span>
      </div>
      <div class="mw-cc__lang-switch">
        <button
          type="button"
          class="mw-cc__lang-btn"
          [class.active]="i18n.language() === 'en'"
          (click)="setLanguage('en')"
        >
          {{ i18n.t('shell.controlCenter.languageEnglish') }}
        </button>
        <button
          type="button"
          class="mw-cc__lang-btn"
          [class.active]="i18n.language() === 'fa'"
          (click)="setLanguage('fa')"
        >
          {{ i18n.t('shell.controlCenter.languagePersian') }}
        </button>
      </div>
    </div>

    <div class="mw-cc__slider-card">
      <div class="mw-cc__slider-head">
        <mw-icon name="sun" [size]="16" />
        <span>{{ i18n.t('shell.controlCenter.brightnessSimulated') }}</span>
      </div>
      <input
        type="range"
        min="30"
        max="100"
        [value]="settings.settings().brightness"
        (input)="setBrightness($event)"
        [attr.aria-label]="i18n.t('shell.controlCenter.brightness')"
      />
    </div>

    <div class="mw-cc__slider-card">
      <div class="mw-cc__slider-head">
        <mw-icon [name]="settings.settings().volume === 0 ? 'volume-mute' : 'volume'" [size]="16" />
        <span>{{ i18n.t('shell.controlCenter.volume') }}</span>
      </div>
      <input
        type="range"
        min="0"
        max="100"
        [value]="settings.settings().volume"
        (input)="setVolume($event)"
        [attr.aria-label]="i18n.t('shell.controlCenter.volume')"
      />
    </div>

    <div class="mw-cc__slider-card">
      <div class="mw-cc__slider-head">
        <mw-icon name="apps" [size]="16" />
        <span>{{ i18n.t('shell.controlCenter.dockSize') }}</span>
      </div>
      <input
        type="range"
        min="40"
        max="80"
        [value]="settings.settings().dockSize"
        (input)="setDockSize($event)"
        [attr.aria-label]="i18n.t('shell.controlCenter.dockSize')"
      />
    </div>
  </div>
}
