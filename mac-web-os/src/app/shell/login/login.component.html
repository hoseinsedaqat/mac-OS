<mw-wallpaper />
<div class="mw-login__scrim"></div>

<div class="mw-login__panel" [class.mw-login__panel--shake]="error()">
  <div class="mw-login__avatar">
    <mw-icon name="user" [size]="42" />
  </div>
  <h1 class="mw-login__name">{{ settings.settings().userName }}</h1>

  @if (passwordEnabled()) {
    <form class="mw-login__form" (ngSubmit)="submit()">
      <input
        type="password"
        class="mw-login__input"
        placeholder="رمز عبور"
        [(ngModel)]="password"
        name="password"
        autocomplete="off"
        [attr.aria-invalid]="error()"
        autofocus
      />
      @if (error()) {
        <p class="mw-login__error">رمز عبور اشتباه است. دوباره تلاش کنید.</p>
      }
      <button type="submit" class="mw-login__submit" aria-label="ورود">
        <mw-icon name="chevronRight" [size]="18" />
      </button>
    </form>
  } @else {
    <p class="mw-login__note">ورود بدون نیاز به رمز عبور فعال است.</p>
    <button type="button" class="mw-btn mw-btn-accent mw-login__enter" (click)="submit()">
      ورود به دسکتاپ
    </button>
  }

  <button type="button" class="mw-login__cancel" (click)="cancel()">بازگشت</button>
</div>
